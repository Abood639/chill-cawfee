  - generic [ref=f6e23]:
    - generic [ref=f6e24]:
      - generic [ref=f6e25]: The Timeline
      - heading "From Valrico to Fishhawk" [level=2] [ref=f6e26]
      - paragraph [ref=f6e27]: Our dream began at the start of Covid. We realized people needed physical connection more than ever, leading us to establish a true neighborhood third place.
    - generic [ref=f6e28]:
      - generic [ref=f6e30]:
        - generic [ref=f6e31]: "2020"
        - heading "The Dream Begins" [level=3] [ref=f6e32]
        - paragraph [ref=f6e33]: Lisa and Tom founded Chill Cawfee in Valrico during a time of isolation, determined to create a comforting sanctuary where neighbors could share a table and a warm handshake.
      - generic [ref=f6e35]:
        - generic [ref=f6e36]: Present Day
        - heading "Our New Home" [level=3] [ref=f6e37]
        - paragraph [ref=f6e38]: Now operated by Lisa and Tom's son Hunter, we relocated to Fishhawk to serve our home community. We brought our signature sweet drinks and lively event calendar with us.
  - generic [ref=f6e41]:
    - img "Lisa and Hunter Behind the Bar at Chill Cawfee" [ref=f6e44]
    - generic [ref=f6e46]:
      - generic [ref=f6e47]: Behind the Bar
      - heading "Lisa and Hunter" [level=2] [ref=f6e48]
      - paragraph [ref=f6e49]: Lisa brings the welcoming warmth that turns first-time visitors into daily regulars, hosting book clubs and networking groups. Her son Hunter handles the bar, pulling rich espresso shots and crafting our signature sweet dreams.
      - paragraph [ref=f6e50]: Together, they keep the shop running as a lively, unpretentious living room. Whether you are here for an entrepreneurial mastermind or a quiet afternoon escape, they always make sure there is an open chair for you.
      - link "Join an Event" [ref=f6e51] [cursor=pointer]:
        - /url: community.html
