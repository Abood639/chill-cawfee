      - generic [ref=f6e14]: Our Story
      - heading [level=1] [ref=f6e15]:
        - text: Fishhawk's Family-Run
        - emphasis [ref=f6e16]: Living Room
      - paragraph [ref=f6e17]: We started Chill Cawfee in 2020 to bring neighbors together. Today, mother and son Lisa and Hunter serve up rich custom drinks and a warm physical space for real connection.
      - link "Come Visit Us" [ref=f6e18] [cursor=pointer]:
        - /url: https://maps.app.goo.gl/ACGVDDwkX2eh1vUDA
