      - heading "Built for Real Connections" [level=2] [ref=f3e54]
      - paragraph [ref=f3e55]: "Founded in 2020 by Lisa and Tom Quigley, Chill Cawfee was created with a simple vision: to bring people together over great coffee, meaningful conversations, and a sense of community. As longtime FishHawk residents since 2001, we've always been passionate about serving the place we call home."
      - paragraph [ref=f3e56]: Today, Lisa proudly operates Chill Cawfee alongside Hunter Quigley, Tom's son and her stepson, continuing the family tradition of creating a welcoming space where neighbors become friends.
      - link "Our Story" [ref=f3e57] [cursor=pointer]:
        - /url: about.html
